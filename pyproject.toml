[project]
name = "fin-c2-090"
version = "0.1.0"
description = "FinancialRegulatoryFilingSearchAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repository generation — a stub package on PYTHONPATH for older repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in the pipeline definition). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
# PyYAML is likewise not pinned here: it is a hard dependency of the framework
# wheel (pyyaml==6.0.1), so declaring it again would risk a second, conflicting
# pin rather than adding anything.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/examples/"]
# Framework-wheel compatibility exception: the published agenticstar-agentcore
# wheel ships no py.typed marker, so framework.* / shared.* imports resolve to
# Any — which makes every required framework subclass an [import-untyped] /
# "subclass of Any" error. All other strict settings stay on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# AgentState resolves to Any for the same reason, so every field annotation in
# a TypedDict that extends it is reported as an invalid type. One cause, many
# messages — suppressed here rather than annotated away field by field.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
